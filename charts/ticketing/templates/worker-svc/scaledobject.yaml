apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-svc-sqs
  namespace: {{ .Release.Namespace }}
  labels:
    app: worker-svc
spec:
  scaleTargetRef:
    name: worker-svc-burst
  pollingInterval: 2
  # cooldownPeriod: 스케일 다운 후 안정화 기간 > 큐가 빈 직후에도 3분동안 진짜 줄어든 게 맞는지 확인
  cooldownPeriod: 90
  minReplicaCount: 0
  maxReplicaCount: 50
  advanced:
    # HPA의 behavior 설정을 통해 스케일 업/다운 시 안정화 기간과 정책을 세밀하게 조정하여, 급격한 트래픽 변화에도 시스템이 안정적으로 대응할 수 있도록 함
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          # stabilizationWindowSeconds: 스케일 다운 후 안정화 기  간 > 5분동안 진짜 줄어든 게 맞는지 확인
          stabilizationWindowSeconds: 180
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 30
            - type: Pods
              value: 10
              periodSeconds: 30
          selectPolicy: Max
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: keda-worker-sqs-aws
      metadata:
        awsRegion: {{ .Values.config.awsRegion }}
        queueURLFromEnv: SQS_QUEUE_URL
        # queueLength > 파드 하나당 메시지 1개를 처리하도록 설정
        queueLength: "10"
        # activationQueueLength > 파드가 스케일 업하기 시작하는 메시지 수
        activationQueueLength: "0"
        # scaleOnInFlight > 현재 파드 내에서 처리 중인 메시지 수를 고려하여 스케일링 여부 결정
        scaleOnInFlight: "true"
